name = "comfyui-mobile-frontend-feedback"
main = "src/index.ts"
compatibility_date = "2026-04-01"

# Public, non-secret config. Secrets (GITHUB_PAT, TURNSTILE_SECRET) are set
# via `wrangler secret put` — never put them here.
[vars]
GITHUB_REPO = "cosmicbuffalo/comfyui-mobile-frontend"
ALLOWED_ORIGINS = "https://comfyui-mobile-frontend.com,http://localhost:3000,http://localhost:8188"

# Per-IP rate limiting. 5 submissions per 60s should comfortably handle real
# users while making spam expensive.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
