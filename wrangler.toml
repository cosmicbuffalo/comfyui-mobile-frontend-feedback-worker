name = "comfyui-mobile-frontend-feedback"
main = "src/index.ts"
compatibility_date = "2026-04-01"

# Public, non-secret config. Secrets (GITHUB_PAT, TURNSTILE_SECRET) are set
# via `wrangler secret put` — never put them here.
[vars]
GITHUB_REPO = "cosmicbuffalo/comfyui-mobile-frontend"
FROM_EMAIL = "feedback@comfyui-mobile-frontend.com"

# Per-IP rate limiting. With Turnstile removed, this is the primary throttle
# against spam alongside the honeypot field. 3 submissions per 60s leaves
# room for a legit user submitting a correction without burning the limit.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

# Status checks and forgetting run on their own while the app is open, so they
# get a looser limit than submitting and replying, which post to GitHub.
[[unsafe.bindings]]
name = "STATUS_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# Hashes of follow secrets, keyed `follow:<issue number>`. Create it once with
# `npx wrangler kv namespace create FEEDBACK_KV`.
[[kv_namespaces]]
binding = "FEEDBACK_KV"
id = "3393d93ad7f44f689735cba864c25c37"
